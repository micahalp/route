[profile.default]
src = "contracts"
test = "contracts/test"
out = "artifacts"
cache_path = "cache/forge"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 256
